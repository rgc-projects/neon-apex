name: Build Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Install npm dependencies
        run: npm ci

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android native project
        run: npx cap sync android

      - name: Decode optional Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/neon-apex-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/neon-apex-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "No release keystore secret configured; Gradle will fall back to debug signing."
          fi

      - name: Compile Android Release APK & Play Store AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Package versioned APK & AAB artifacts
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "apk-out/NEON-APEX-v${APP_VER}-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "apk-out/NEON-APEX-v${APP_VER}-android.aab"
          ls -lh apk-out/
          sha256sum apk-out/*

      - name: Upload installable Android APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neon-apex-android-release
          path: apk-out/*
          retention-days: 30
