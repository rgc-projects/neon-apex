name: Build Android APK

on:
  push:
    branches:
      - main
      - feat/mobile-android-i18n
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Install npm dependencies
        run: npm ci

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android native project
        run: npx cap sync android

      - name: Compile Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package APK with versioned filename
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk apk-out/NEON-APEX-v2.0.0-android.apk
          ls -lh apk-out/NEON-APEX-v2.0.0-android.apk
          sha256sum apk-out/NEON-APEX-v2.0.0-android.apk

      - name: Upload installable Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-apex-android-apk
          path: apk-out/NEON-APEX-v2.0.0-android.apk
          retention-days: 30
